<text x="800" y="49" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#172236">Explicit structure · Complete alternatives</text>
<text x="800" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#556174">structure.py / model.py: graph identity is the decision unit; texture is not forced into a graph</text>
