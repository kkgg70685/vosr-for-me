<rect x="70" y="130" width="260" height="70" rx="12" fill="#ffffff" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="200.0" y="171.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">LR RGB</text>
<rect x="70" y="265" width="260" height="110" rx="12" fill="#b8dbc7" stroke="#4e8267" stroke-width="1.5" filter="url(#shadow)"/>
<text x="200.0" y="302.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">StructureHead</text>
<text x="200.0" y="326.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">3 × 3 convolution stack</text>
<text x="200.0" y="350.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">subpixel ×4 output</text>
<rect x="430" y="190" width="430" height="160" rx="12" fill="#b8dbc7" stroke="#4e8267" stroke-width="1.5" filter="url(#shadow)"/>
<text x="645.0" y="240.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">9 dense maps</text>
<text x="645.0" y="264.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">ink / endpoint / corner / boundary</text>
<text x="645.0" y="288.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">x-y affinity / repeat likelihood</text>
<text x="645.0" y="312.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">period vector (dx, dy)</text>
<rect x="1030" y="190" width="440" height="160" rx="12" fill="#b8dbc7" stroke="#4e8267" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1250.0" y="240.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Threshold → thin → explicit graph</text>
<text x="1250.0" y="264.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">vertices at HR pixel centres</text>
<text x="1250.0" y="288.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">edges encode actual connectivity</text>
<text x="1250.0" y="312.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">endpoint / turn consistency from degree</text>
<rect x="1030" y="420" width="440" height="110" rx="12" fill="#e2e3e5" stroke="#777d85" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1250.0" y="457.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Merge nearby fragments and halos</text>
<text x="1250.0" y="481.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">reject dense / oversized / colliding objects</text>
<text x="1250.0" y="505.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">no arbitrary tiling of a stroke</text>
<rect x="80" y="620" width="310" height="110" rx="12" fill="#6089ce" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="235.0" y="657.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">POSITION</text>
<text x="235.0" y="681.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">reference + ±x / ±y translation</text>
<text x="235.0" y="705.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">move the entire graph</text>
<rect x="490" y="620" width="310" height="110" rx="12" fill="#efb9be" stroke="#9c646f" stroke-width="1.5" filter="url(#shadow)"/>
<text x="645.0" y="657.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">CONNECTION</text>
<text x="645.0" y="681.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">join nearest eligible endpoints</text>
<text x="645.0" y="705.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">or open a chain segment</text>
<rect x="900" y="620" width="310" height="110" rx="12" fill="#e99557" stroke="#9e572c" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1055.0" y="657.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">REPETITION PHASE</text>
<text x="1055.0" y="681.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">optional half-period translation</text>
<text x="1055.0" y="705.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">keep all repeated edges coherent</text>
<rect x="450" y="815" width="710" height="90" rx="12" fill="#ffffff" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="805.0" y="854.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">At most 8 complete graphs per object</text>
<text x="805.0" y="878.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">reference + 4 position + 2 connection + 1 phase; no untested combinations</text>
<text x="800" y="970" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#556174">Blue: spatial / native · Orange: visual / ambiguity · Green: structure / evidence · Pink: velocity · Gray: nuisance / training</text></svg>