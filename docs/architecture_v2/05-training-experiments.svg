<text x="810.0" y="603.0" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#355786">locked protocol</text>
<rect x="70" y="150" width="400" height="100" rx="12" fill="#ffffff" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="270.0" y="182.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Training-only paired data</text>
<text x="270.0" y="206.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">LR + HR + explicit structure masks</text>
<text x="270.0" y="230.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">synthetic primitives for initialisation</text>
<rect x="610" y="150" width="380" height="120" rx="12" fill="#b8dbc7" stroke="#4e8267" stroke-width="1.5" filter="url(#shadow)"/>
<text x="800.0" y="180.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Stage A: train StructureHead</text>
<text x="800.0" y="204.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">class-balanced 7-map supervision</text>
<text x="800.0" y="228.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">period regression + link incidence</text>
<text x="800.0" y="252.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">endpoint / graph proposal qualification</text>
<rect x="1140" y="150" width="370" height="145" rx="12" fill="#efb9be" stroke="#9c646f" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1325.0" y="180.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Stage B: train velocity adapter</text>
<text x="1325.0" y="204.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">frozen VOSR + frozen structure head</text>
<text x="1325.0" y="228.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">HR selects a compatible training candidate</text>
<text x="1325.0" y="252.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">sample a native suffix state</text>
<text x="1325.0" y="276.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">decode clean-prediction surrogate</text>
<rect x="1140" y="410" width="370" height="105" rx="12" fill="#efb9be" stroke="#9c646f" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1325.0" y="444.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Loss</text>
<text x="1325.0" y="468.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">object RGB + signed gradients</text>
<text x="1325.0" y="492.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">exterior identity + residual penalty</text>
<rect x="610" y="410" width="380" height="105" rx="12" fill="#e2e3e5" stroke="#777d85" stroke-width="1.5" filter="url(#shadow)"/>
<text x="800.0" y="444.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Parent / camera-isolated development</text>
<text x="800.0" y="468.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">qualify graph and relation readout first</text>
<text x="800.0" y="492.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">lock weights, masks, thresholds, protocol</text>
<rect x="70" y="410" width="400" height="145" rx="12" fill="#6089ce" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="270.0" y="440.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Matched-seed comparisons</text>
<text x="270.0" y="464.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">raw native / locked v1.5 / full v2</text>
<text x="270.0" y="488.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">uniform / misplaced graph</text>
<text x="270.0" y="512.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">no acceptance / no feedback</text>
<text x="270.0" y="536.5" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">8, 12, 16, 20 shared-step interventions</text>
<rect x="450" y="705" width="740" height="150" rx="12" fill="#ffffff" stroke="#355786" stroke-width="1.5" filter="url(#shadow)"/>
<text x="820.0" y="738.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">Held-out evaluation</text>
<text x="820.0" y="762.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">missing + unstable endpoint rates; connection error bounds</text>
<text x="820.0" y="786.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">boundary / skeleton / phase; PSNR / LPIPS / DISTS</text>
<text x="820.0" y="810.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">average seeds within parent → paired parent bootstrap</text>
<text x="820.0" y="834.0" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#172236">report every device, worst group, acceptance coverage, runtime and memory</text>
<text x="800" y="970" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#556174">Blue: spatial / native · Orange: visual / ambiguity · Green: structure / evidence · Pink: velocity · Gray: nuisance / training</text></svg>