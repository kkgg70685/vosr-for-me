<text x="790" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#355786">HR is training-only</text>
<polyline points="1325.0,295.0 1325.0,352.5 1325.0,352.5 1325.0,410.0" fill="none" stroke="#9c646f" stroke-width="2" marker-end="url(#pink)"/>
