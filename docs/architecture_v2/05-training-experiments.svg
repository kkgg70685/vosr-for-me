<text x="800" y="49" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#172236">Training and experiments · What is and is not established</text>
<text x="800" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#556174">train.py / evaluate.py: train new modules only; isolate parents and cameras; retain failed readouts in denominators</text>
<polyline points="470.0,200.0 540.0,200.0 540.0,210.0 610.0,210.0" fill="none" stroke="#4e8267" stroke-width="2" marker-end="url(#green)"/>
