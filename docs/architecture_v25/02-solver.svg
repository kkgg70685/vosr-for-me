<text x="635.0" y="498.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596779" stroke="white" stroke-width="5" paint-order="stroke">r(a)</text>
<polyline points="330,510.0 270,510.0" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arr)"/>
<text x="300.0" y="498.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596779" stroke="white" stroke-width="5" paint-order="stroke">modes</text>
<polyline points="165.0,580 165.0,710" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arr)"/>
<text x="165.0" y="633.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596779" stroke="white" stroke-width="5" paint-order="stroke">trial</text>
