<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596779"/></marker></defs>
<rect width="1560" height="1000" fill="white"/>
<text x="780.0" y="52.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="30" fill="#263648">From RGB evidence to an executable coordinate map</text>
<text x="780.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="17" fill="#667587">model.py + geometry.py | Fixed 3 iterations; four backtracking rates; no learned residual adapter</text>
<polyline points="250,270.0 330,270.0" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="590,270.0 680,270.0" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arr)"/>
<text x="635.0" y="258.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596779" stroke="white" stroke-width="5" paint-order="stroke">HR units</text>
<polyline points="1020,270.0 1130,270.0" fill="none" stroke="#596779" stroke-width="2" marker-end="url(#arr)"/>
<text x="1075.0" y="258.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596779" stroke="white" stroke-width="5" paint-order="stroke">backward map</text>
